<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descles edge console</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/edge_admin.css"></head>
<body><aside><a class="brand" href="/admin/#overview"><i class="brand-mark" aria-hidden="true"></i>descles<span class="brand-caption">EDGE CONSOLE</span></a><div class="nav-label">YOUR EDGE</div><nav id="navigation" aria-label="Main navigation"></nav><div class="sidebar-foot"><span class="status-dot"></span> Customer hosted<br><small>Govern · Observe · Improve</small></div></aside>
<main><header><div><span class="muted">Edge</span><span class="crumb">/</span><strong id="breadcrumb">Overview</strong></div><div class="header-actions"><span id="connection" class="badge">Disconnected</span><button id="signout" class="secondary" hidden>Disconnect</button></div></header>
<section id="login" class="login card"><div class="login-icon" data-icon="agents"></div><div class="eyebrow">WELCOME TO DESCLES</div><h1>Run your edge from here.</h1><p>Enter the admin token in <code>config/secrets/admin-token</code>. It stays in this browser tab.</p><form id="login-form"><label for="token">Edge admin token</label><input id="token" type="password" required autocomplete="off" placeholder="Paste your token"><button>Connect edge</button></form></section>
<div id="workspace" hidden><div class="page-heading"><div class="page-heading-copy"><div class="page-icon" id="page-icon" data-icon="overview"></div><div><div class="eyebrow" id="eyebrow">CUSTOMER HOSTED</div><h1 id="page-title">Overview</h1><p id="page-description"></p></div></div><div class="toolbar"><button id="refresh" class="secondary" data-icon="refresh">Refresh</button></div></div><div id="view" aria-live="polite"></div></div>
<div id="notice" role="status" hidden></div></main>
<dialog id="detail"><div class="dialog-heading"><h2 id="detail-title">Details</h2><button id="detail-close" class="secondary icon-only" aria-label="Close details">✕</button></div><div id="detail-body"></div></dialog>
<script src="/edge_admin.js"></script><script src="/icons.js"></script></body></html>
